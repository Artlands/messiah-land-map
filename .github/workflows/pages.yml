name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the generated map data
        run: npm run verify
      - name: Check the Traditional Chinese table is current
        run: |
          npm run build:zh
          git diff --exit-code app/zh-hant.ts
      - name: Check every Chinese string has an English form
        run: npm run check:en
      - name: Check the map view maths
        run: npm run check:view
      # Not allowed to block a deploy: it talks to YouTube, and an outage there
      # is no reason to stop shipping terrain. It still surfaces a dead embed.
      - name: Check the embedded videos still resolve
        run: npm run check:videos
        continue-on-error: true
      - run: npm run build:static
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
